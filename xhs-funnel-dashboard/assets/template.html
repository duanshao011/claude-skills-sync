<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投放数据看板</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1><span class="dot">●</span> 投放数据看板</h1>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="sub" style="text-align:right">蒲公英内容 → 星河进店 → 成交<br>三表打通 · 相对水位线判断</div>
  </header>

  <!-- 模块1 KPI -->
  <section>
    <div class="sec-head"><span class="idx">1</span><h2>全局概览</h2>
      <span class="hint">本期投放总览与四象限分布</span></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <!-- 模块2 四象限 -->
  <section>
    <div class="sec-head"><span class="idx">2</span><h2>四象限判断矩阵</h2>
      <span class="hint">点大小=GMV · 颜色=象限 · 右上=值得加投，左上=重点追投种子</span></div>
    <div class="panel"><div class="chart tall" id="quadChart"></div></div>
  </section>

  <!-- 模块3 明细表 -->
  <section>
    <div class="sec-head"><span class="idx">3</span><h2>笔记全链路明细</h2>
      <span class="hint">单元格按本期水位线着色：青绿优质 / 琥珀预警</span></div>
    <div class="panel">
      <div class="toolbar">
        <div class="grp">
          <button class="btn" data-grp="quality">内容质量</button>
          <button class="btn" data-grp="funnel">转化漏斗</button>
          <button class="btn on" data-grp="eff">效率/ROI</button>
        </div>
        <select id="fQuad"><option value="">全部象限</option>
          <option value="重点追投">重点追投</option><option value="加大投/稳住">加大投/稳住</option>
          <option value="止损">止损</option><option value="观察">观察</option></select>
        <select id="fInvest"><option value="">投放不限</option>
          <option value="yes">已投薯条</option><option value="no">未投薯条</option></select>
        <input id="fKw" placeholder="搜达人 / 标题" style="width:160px">
        <span class="spacer"></span><span class="cnt" id="tblCnt"></span>
      </div>
      <div class="tbl-scroll"><table><thead id="tblHead"></thead><tbody id="tblBody"></tbody></table></div>
    </div>
  </section>

  <!-- 模块4 趋势 -->
  <section>
    <div class="sec-head"><span class="idx">4</span><h2>笔记每日趋势</h2>
      <span class="hint">选一篇看进店 / 加购 / 成交的逐日曲线</span></div>
    <div class="panel">
      <div class="toolbar"><span style="color:var(--muted);font-size:12px">搜索</span>
        <input id="trendKw" placeholder="达人昵称 或 笔记id" style="width:200px">
        <span style="color:var(--muted);font-size:12px">选择笔记</span>
        <select id="trendSel" style="min-width:340px"></select>
        <span class="spacer"></span><span class="cnt" id="trendCnt"></span></div>
      <div class="chart" id="trendChart"></div>
    </div>
  </section>

  <!-- 模块5 洞察 -->
  <section>
    <div class="sec-head"><span class="idx">5</span><h2>复用洞察 · 选谁投什么</h2>
      <span class="hint">从高ROI笔记自动提取共性 + 稳定达人名单</span></div>
    <div id="insWrap"></div>
  </section>

</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>/*__ECHARTS__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
