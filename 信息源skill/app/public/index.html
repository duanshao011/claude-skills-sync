<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息源监控</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ===== LEFT SIDEBAR ===== -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>🔭 信息源监控</h1>
      <div class="dimension-tabs">
        <div class="dim-tab active" data-dim="blogger">博主</div>
        <div class="dim-tab" data-dim="topic">主题</div>
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="sidebarSearch" placeholder="搜索博主 / 主题...">
    </div>
    <div class="sidebar-list" id="sidebarList">
      <!-- Rendered by JS -->
    </div>
    <div class="sidebar-footer">
      <div class="add-btn" id="addBtn">+ 添加博主</div>
    </div>
  </div>

  <!-- ===== MIDDLE ARTICLE LIST ===== -->
  <div class="article-list">
    <div class="article-list-header" id="articleListHeader">
      <h2>选择一位博主</h2>
    </div>
    <div class="top-bar" id="topBar" style="display:none">
      <div class="top-stats" id="topStats"></div>
      <span class="top-action" id="readAllBtn">全部已读</span>
    </div>
    <div class="article-list-body" id="articleListBody">
      <div class="empty-hint">👈 在左侧选择博主或主题开始浏览</div>
    </div>
  </div>

  <!-- ===== RIGHT CONTENT PANEL ===== -->
  <div class="content-panel">
    <div class="content-header" id="contentHeader" style="display:none">
      <div class="source-info">
        <span class="source-icon" id="sourceIcon"></span>
        <span class="pub-time" id="pubTime"></span>
      </div>
      <div class="content-actions">
        <span class="content-action-btn" id="favBtn">⭐ 收藏</span>
        <a class="content-action-btn" id="originBtn" target="_blank">🔗 原文</a>
        <span class="content-action-btn" id="summaryBtn">📋 摘要</span>
      </div>
    </div>
    <div class="content-body" id="contentBody">
      <div class="empty-hint">选择一篇文章阅读</div>
    </div>
  </div>

</div>

<!-- ===== Tag popover ===== -->
<div class="tag-popover" id="tagPopover">
  <div class="tag-popover-header">归入主题（可多选）</div>
  <div class="tag-popover-list" id="tagPopoverList"></div>
</div>

<!-- ===== Unfollow tooltip ===== -->
<div class="unfollow-tooltip" id="unfollowTooltip">
  <p>取消关注 <span class="tooltip-name" id="unfollowName"></span>？</p>
  <div class="unfollow-hint">已抓取的历史内容会保留</div>
  <div class="tooltip-btns">
    <button class="btn-cancel">再想想</button>
    <button class="btn-confirm">取消关注</button>
  </div>
</div>

<!-- ===== Topic modal ===== -->
<div class="modal-overlay" id="topicModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">编辑主题</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-label">主题名称</div>
      <div class="topic-name-row">
        <input type="text" id="topicNameInput" placeholder="输入主题名称">
      </div>
      <div class="field-label">主题下的博主</div>
      <div class="chip-input-wrap" id="chipWrap">
        <input class="chip-input" id="chipSearch" placeholder="搜索添加博主...">
      </div>
      <div class="chip-dropdown" id="chipDropdown"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary">取消</button>
      <button class="modal-btn primary">保存</button>
    </div>
  </div>
</div>

<!-- ===== Add blogger modal ===== -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3>添加博主</h3>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-label">渠道</div>
      <div class="channel-select" id="channelSelect">
        <div class="channel-option active" data-channel="youtube">▶️ YouTube</div>
        <div class="channel-option disabled">📱 公众号（即将支持）</div>
        <div class="channel-option disabled">📕 小红书（即将支持）</div>
      </div>
      <div class="field-label" style="margin-top:16px">频道链接或ID</div>
      <div class="topic-name-row">
        <input type="text" id="addUrlInput" placeholder="例如：https://www.youtube.com/@Fireship">
        <button class="modal-btn primary" id="validateBtn">验证</button>
      </div>
      <div id="validateResult" style="margin-top:8px;font-size:12px"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary">取消</button>
      <button class="modal-btn primary" id="confirmAddBtn" disabled>添加</button>
    </div>
  </div>
</div>

<!-- ===== Summary overlay ===== -->
<div class="summary-overlay" id="summaryOverlay" style="display:none">
  <div class="summary-card">
    <div class="modal-header">
      <h3>AI 摘要</h3>
      <button class="modal-close" id="summaryClose">✕</button>
    </div>
    <div class="summary-card-body" id="summaryContent">
      <div class="loading-spinner">生成中...</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
